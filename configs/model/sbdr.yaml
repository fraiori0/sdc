# @package _global_
# Arm B (HANDOUT.md §2.3, §2.4, §2.5, §3): "full proposal" -- bounded head (clip or
# sigmoid), no sampling, our critic on `z` directly. Mirrors CIBHash's backbone,
# transforms, and optimizer settings (§1.1) so mAP stays comparable to Arm A/D.
# code_domain/dist_metric MUST be `unit`/`overlap`: unlike Arm D (which reuses
# CIBHash's arch and therefore CIBHash's signed logits), this arm's `codes` key is
# a genuine [0,1] code (§2.1's domain trap applies directly here).
defaults:
  - override /transforms: cibhash
  - override /backbone: vgg16
  - _self_


model:
  _target_: models.arch.sbdr.SBDR
  backbone: ${backbone}
  nbit: 64
  nclass: ${dataset.nclass}
  act: clip           # HANDOUT §2.3 prefers `clip` over `sigmoid`: linear interior gradient

trainer:
  _target_: trainers.sbdr.SBDRTrainer

criterion:
  _target_: models.loss.sbdr.SBDRCriticLoss
  eps: 0.31             # d=64, kappa_target=8 -> eps ~= kappa^2 / (3.24*d) (HANDOUT §0.3)
  symmetric: True
  detach_mean: False    # MUST NOT be True by default (HANDOUT §0.1) -- ablation only
  critic_order: 1        # 1 = first-order (original) critic; 2 = + quadratic term (HANDOUT §2.2b)
  lambda2: null          # only used when critic_order=2; null -> default 1/(2*eps)
  lambda_q: 0.0          # SDC-style quantization loss on pre-activation logits, off by default (HANDOUT §13 Task 4)

code_domain: unit
dist_metric: overlap
zero_mean_eval: False   # MUST stay off -- mean-centering destroys the sparse structure
